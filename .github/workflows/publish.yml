name: Release

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write # required for npm provenance (OIDC)

jobs:
    release:
        runs-on: ubuntu-latest
        environment: Default
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false # avoid exposing the OIDC token to a poisoned cache

            - name: Install deps (CI)
              run: npm ci

            - name: Run tests
              env:
                  API_KEY: ${{ secrets.API_KEY }}
                  MATCHDAY_API_URL: ${{ secrets.MATCHDAY_API_URL }}
              run: npm test

            # Opens/updates a "Version Packages" PR when changesets are pending on main;
            # once that PR is merged (no changesets left), publishes to npm instead.
            - name: Create Release PR or publish to npm
              uses: changesets/action@v1
              with:
                  version: npm run version
                  publish: npm run release
                  createGithubReleases: true
                  # commitlint requires a conventional-commit message; the action's
                  # default "Version Packages" fails our own commit-msg hook.
                  commit: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
